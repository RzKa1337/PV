name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create tag + GitHub release for this commit (e.g. v0.1.0). Leave empty for a normal build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: solar-tracker-pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Invalid tag: $TAG"; exit 1 ;; esac
          cp app/build/outputs/apk/debug/app-debug.apk "SolarTrackerPRO-${TAG}-debug.apk"
          # Release notes: the CHANGELOG section for this version.
          awk -v v="[$TAG]" 'index($0, "## " v) == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Solar Tracker PRO $TAG" --notes-file notes.md
          gh release upload "$TAG" "SolarTrackerPRO-${TAG}-debug.apk" --clobber
