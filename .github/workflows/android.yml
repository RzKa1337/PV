name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create tag + GitHub release for this commit (e.g. v0.1.0). Leave empty for a normal build."
        required: false
        default: ""

# Least privilege: read-only by default; only the build job (which attaches release assets) may write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: solar-tracker-pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            trap 'rm -f "$SIGNING_KEYSTORE_FILE"' EXIT
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$SIGNING_KEYSTORE_FILE"
            echo "SIGNED_WITH_RELEASE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning title=Release signing::Brak sekretu SIGNING_KEYSTORE_BASE64 - APK wydania podpisane kluczem debug runnera (aktualizacja poprzedniej instalacji nie bedzie mozliwa). Zobacz docs/RELEASE_SIGNING.md"
            echo "SIGNED_WITH_RELEASE_KEY=false" >> "$GITHUB_ENV"
          fi
          ./gradlew :app:assembleRelease
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signing-cert.txt

      - name: Attach APK and checksums to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Invalid tag: $TAG"; exit 1 ;; esac
          mkdir dist
          # Name pattern used by the in-app updater: <name>-<tag>-<abi|universal>.apk + SHA256SUMS
          cp app/build/outputs/apk/release/app-release.apk "dist/SolarTrackerPRO-${TAG}-universal.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)
          # Release notes: the CHANGELOG section for this version + signing certificate.
          awk -v v="[$TAG]" 'index($0, "## " v) == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          {
            echo
            echo "---"
            echo "SHA-256 certyfikatu podpisu: \`$(grep -m1 'SHA-256 digest' signing-cert.txt | sed 's/.*: //')\`"
            [ "$SIGNED_WITH_RELEASE_KEY" = true ] || echo "⚠️ Podpisane kluczem tymczasowym (brak klucza wydania) – wymaga odinstalowania poprzedniej wersji."
          } >> notes.md
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Solar Tracker PRO $TAG" --notes-file notes.md
          gh release upload "$TAG" dist/* --clobber

  live-ui-test:
    # Runs the app on an Android emulator and watches the Live Solar screen for 3 minutes.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/android/sdk/ndk
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Live Solar test on emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2 (pinned third-party action)
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disk-size: 3000M
          ram-size: 2048M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/run-live-ui-test.sh

      - name: Upload Live Solar test output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-solar-ui-test
          path: |
            live-test-output/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
